version: '3.8'

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: smartwater-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_water_management}
      POSTGRES_USER: ${DB_USERNAME:-water_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-water_secure_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-water_admin} -d ${DB_NAME:-smart_water_management}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartwater-network

  # Backend REST API Service (Spring Boot 3 + Java 21)
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: smartwater-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_water_management}
      DB_USERNAME: ${DB_USERNAME:-water_admin}
      DB_PASSWORD: ${DB_PASSWORD:-water_secure_password}
      FLYWAY_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80"
    ports:
      - "8080:8080"
    networks:
      - smartwater-network

  # Frontend Web Client (React + Vite + Nginx)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: smartwater-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - smartwater-network

networks:
  smartwater-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
